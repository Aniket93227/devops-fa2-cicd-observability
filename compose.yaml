
services:
  backend:
    build:
      context: ./backend
    image: fa2-backend:1.0
    container_name: fa2-compose-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: fa2-frontend:1.0
    container_name: fa2-compose-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
