
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fa2-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fa2-api
  template:
    metadata:
      labels:
        app: fa2-api
    spec:
      containers:
        - name: api
          image: fa2-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
