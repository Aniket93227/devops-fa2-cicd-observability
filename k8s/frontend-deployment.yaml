
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fa2-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fa2-web
  template:
    metadata:
      labels:
        app: fa2-web
    spec:
      containers:
        - name: web
          image: fa2-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
