
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fa2-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fa2-grafana
  template:
    metadata:
      labels:
        app: fa2-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "Fa2Grafana2026!"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
