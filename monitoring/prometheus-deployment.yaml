
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fa2-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fa2-prometheus
  template:
    metadata:
      labels:
        app: fa2-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: prometheus-config
          configMap:
            name: fa2-prometheus-config
